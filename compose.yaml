services:
  ticket-sync-mvc:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${APP_PORT:-8001}:8001"
    environment:
      DATABASE_PATH: /data/ticket-sync.db
      APP_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      LEGACY_VERIFY_URL: ${LEGACY_VERIFY_URL:-}
      TZ: Asia/Colombo
    volumes:
      - mvc-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  mvc-data:
