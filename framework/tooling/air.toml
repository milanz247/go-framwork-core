root = "."
tmp_dir = ".tmp"
[build]
cmd = "go build -buildvcs=false -o .tmp/server ./cmd/server"
entrypoint = ["./.tmp/server"]
include_ext = ["go", "html", "json", "css", "js", "svg"]
exclude_dir = ["node_modules", "data", ".tmp", "bin", "docs", "private"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"
[log]
time = false
[misc]
clean_on_exit = true
