{{define "ui/field"}}
  <label class="field {{.Class}}">
    <span>
      {{.Label}}
    </span>
    <input name="{{.Name}}" type="{{if .Type}}{{.Type}}{{else}}text{{end}}" value="{{.Value}}" {{if .Placeholder}}placeholder="{{.Placeholder}}"{{end}} {{if .Required}}required{{end}} {{if .Autocomplete}}autocomplete="{{.Autocomplete}}"{{end}}>
    {{if .Help}}
      <small>
        {{.Help}}
      </small>
    {{end}}
  </label>
{{end}}
