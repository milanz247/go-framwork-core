{{define "ui/password-field"}}
  <label class="field">
    <span>{{.Label}}</span>
    <span class="auth-password-control">
      <input id="{{.ID}}" aria-label="{{.Label}}" type="password" name="{{.Name}}" {{if .Required}}required{{end}} autocomplete="{{.Autocomplete}}" placeholder="{{.Label}}" {{if .Help}}aria-describedby="{{.ID}}-help"{{end}}>
      <button type="button" data-action="toggle-password" aria-controls="{{.ID}}" aria-label="Show password" aria-pressed="false">Show</button>
    </span>
    {{if .Help}}<small id="{{.ID}}-help">{{.Help}}</small>{{end}}
  </label>
{{end}}
